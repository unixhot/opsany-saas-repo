<!DOCTYPE html>
<html lang="zh-cmn-Hans" class="theme-default">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<link rel="icon" href="<%= BASE_URL %>logo.png" />
		<title>制品仓库 | 智能运维</title>
		<style>
			#loading-mask {
				position: fixed;
				left: 0;
				top: 0;
				height: 100%;
				width: 100%;
				background: #fff;
				user-select: none;
				z-index: 9999;
				overflow: hidden;
			}
			.loading-wrapper {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -100%);
			}
			.loading-dot {
				animation: antRotate 1.2s infinite linear;
				transform: rotate(45deg);
				position: relative;
				display: inline-block;
				font-size: 64px;
				width: 64px;
				height: 64px;
				box-sizing: border-box;
			}
			.loading-dot i {
				width: 22px;
				height: 22px;
				position: absolute;
				display: block;
				background-color: #1890ff;
				border-radius: 100%;
				transform: scale(0.75);
				transform-origin: 50% 50%;
				opacity: 0.3;
				animation: antSpinMove 1s infinite linear alternate;
			}
			.loading-dot i:nth-child(1) {
				top: 0;
				left: 0;
			}
			.loading-dot i:nth-child(2) {
				top: 0;
				right: 0;
				-webkit-animation-delay: 0.4s;
				animation-delay: 0.4s;
			}
			.loading-dot i:nth-child(3) {
				right: 0;
				bottom: 0;
				-webkit-animation-delay: 0.8s;
				animation-delay: 0.8s;
			}
			.loading-dot i:nth-child(4) {
				bottom: 0;
				left: 0;
				-webkit-animation-delay: 1.2s;
				animation-delay: 1.2s;
			}
			@keyframes antRotate {
				to {
					-webkit-transform: rotate(405deg);
					transform: rotate(405deg);
				}
			}
			@-webkit-keyframes antRotate {
				to {
					-webkit-transform: rotate(405deg);
					transform: rotate(405deg);
				}
			}
			@keyframes antSpinMove {
				to {
					opacity: 1;
				}
			}
			@-webkit-keyframes antSpinMove {
				to {
					opacity: 1;
				}
			}
		</style>
		<!-- require cdn assets css -->
		<% for (var i in htmlWebpackPlugin.options.cdn && htmlWebpackPlugin.options.cdn.css) { %>
		<link rel="stylesheet" href="<%= htmlWebpackPlugin.options.cdn.css[i] %>" />
		<% } %>
	</head>
	<body>
		<noscript>
			<strong>We're sorry but vue-antd-pro doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
		</noscript>
		<div id="app">
			<div id="loading-mask">
				<div class="loading-wrapper">
					<span class="loading-dot loading-dot-spin"><i></i><i></i><i></i><i></i></span>
				</div>
			</div>
		</div>
		<script>
			window.API_ROOT = "{{SITE_URL}}";
			let script = document.createElement("script");
			script.src = window.location.origin + "/" + window.API_ROOT.split("/")[1] + "/llmops/static/chat/opsany-chat-modal.umd.js?t=" + Date.now();
			// 公共 header（<opsany-header> 自定义元素），dev/prod 均从 workbench 的静态目录加载（单点更新）
			let headerScript = document.createElement("script");
			if (window.API_ROOT && window.API_ROOT.indexOf("SITE_URL") > -1) {
				// dev：API_ROOT 是 SITE_URL 占位符，硬编码测试服务器上部署的产物
				headerScript.src = "https://192.168.0.111/t/workbench/static/header/opsany-header.umd.js?t=" + Date.now();
			} else {
				// prod：按当前平台前缀推导 workbench 静态目录
				headerScript.src = window.location.origin + "/" + window.API_ROOT.split("/")[1] + "/workbench/static/header/opsany-header.umd.js?t=" + Date.now();
			}
			document.body.appendChild(headerScript);
			document.body.appendChild(script);
		</script>
		<!-- require cdn assets js -->
		<% for (var i in htmlWebpackPlugin.options.cdn && htmlWebpackPlugin.options.cdn.js) { %>
		<script type="text/javascript" src="<%= htmlWebpackPlugin.options.cdn.js[i] %>"></script>
		<% } %>
	</body>
</html>
